name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run lint
      - name: Deploy to Render
        run: |
          echo "Deployment to Render is handled automatically through Render's GitHub integration."
          echo "Make sure you have connected your GitHub repository to Render and enabled auto-deployments."